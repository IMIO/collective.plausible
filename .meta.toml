# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[gitignore]
extra_lines = """
.venv
htmlcov/
.mxdev_cache/
requirements.txt
"""

[pyproject]
# plone.resource: used through <plone:static> in browser/configure.zcml
# plone.classicui: classic distribution for the dev instance (scripts/create_site.py)
dependencies_ignores = "['plone.resource', 'plone.classicui']"
check_manifest_ignores = """
    "Makefile",
    "update-locales.sh",
    "instance.yaml",
    "scripts/*",
"""

[tox]
test_matrix = {"6.2" = ["3.13", "3.12", "3.11", "3.10"], "6.1" = ["3.13", "3.12", "3.11", "3.10"]}
constraints_files = {"6.2" = "https://dist.plone.org/release/6.2.3/constraints.txt", "6.1" = "https://dist.plone.org/release/6.1-latest/constraints.txt"}
